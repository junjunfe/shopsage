<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopGuide 智购导购</title><style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#17202a;background:#f3f5f7}body{margin:0}.shell{max-width:1080px;margin:auto;padding:28px}.hero{background:linear-gradient(135deg,#102a43,#167d73);color:white;padding:30px;border-radius:22px}.hero h1{margin:0 0 8px}.chat{background:white;margin-top:18px;border-radius:18px;padding:18px;box-shadow:0 8px 30px #102a4314}.messages{min-height:260px;max-height:520px;overflow:auto}.msg{margin:10px 0;padding:12px 15px;border-radius:14px;max-width:82%;white-space:pre-wrap}.user{background:#167d73;color:white;margin-left:auto}.agent{background:#edf3f2}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:10px;margin:12px 0}.card{border:1px solid #dbe4e3;border-radius:13px;padding:13px}.price{font-size:21px;font-weight:700;color:#c34827}.meta{font-size:13px;color:#64736f}.row{display:flex;gap:8px;margin-top:15px}input{flex:1;padding:13px;border:1px solid #ccd7d5;border-radius:12px;font-size:15px}button{border:0;border-radius:12px;padding:0 18px;background:#167d73;color:white;cursor:pointer}.chips button{padding:7px 10px;margin:5px 5px 0 0;background:#e4f1ef;color:#155d56}.empty{color:#71807c;padding:70px 10px;text-align:center}
</style></head><body><main class="shell"><section class="hero"><h1>ShopGuide Agent</h1><div>说出预算、用途和偏好，我会搜索、筛选并解释推荐依据。</div></section><section class="chat"><div id="messages" class="messages"><div class="empty">试试：“5000 元以内适合编程的轻薄笔记本”</div></div><div id="chips" class="chips"></div><form id="form" class="row"><input id="input" autocomplete="off" placeholder="描述你想买的商品…"><button>发送</button></form></section></main><script>
let sessionId=localStorage.shopguideSession||null;const messages=document.querySelector('#messages'),input=document.querySelector('#input'),chips=document.querySelector('#chips');
function msg(text,cls){if(messages.querySelector('.empty'))messages.innerHTML='';const el=document.createElement('div');el.className='msg '+cls;el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight}
function products(items){const grid=document.createElement('div');grid.className='products';items.forEach(({product:p,match_reasons:r})=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<strong>${p.title}</strong><div class="price">¥${p.price}</div><div class="meta">${p.rating} 分 · 库存 ${p.stock}<br>${r.join('；')}<br>ID: ${p.id}</div>`;grid.append(c)});messages.append(grid)}
async function send(text){msg(text,'user');input.value='';chips.innerHTML='';const res=await fetch('/api/v1/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session_id:sessionId,message:text})});const data=await res.json();sessionId=data.session_id;localStorage.shopguideSession=sessionId;msg(data.text,'agent');products(data.products||[]);(data.suggestions||[]).forEach(s=>{const b=document.createElement('button');b.textContent=s;b.onclick=()=>send(s);chips.append(b)})}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();if(input.value.trim())send(input.value.trim())};
</script></body></html>
